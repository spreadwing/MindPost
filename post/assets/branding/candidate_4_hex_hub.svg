<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#082F49" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- 底板容器 -->
  <rect width="512" height="512" rx="115" fill="url(#bg4)"/>

  <!-- 六边形节点环 -->
  <polygon points="256,120 376,190 376,330 256,400 136,330 136,190" 
           fill="none" stroke="#7DD3FC" stroke-width="20" stroke-linejoin="round" opacity="0.45"/>

  <!-- 核心向上/向右投递剪影 (Post Arrow) -->
  <g filter="url(#shadow4)">
    <path d="M 180 340 L 320 200 M 230 195 L 330 190 L 325 290" 
          stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- 节点圆斑 -->
    <circle cx="180" cy="340" r="22" fill="#E0F2FE"/>
    <circle cx="256" cy="265" r="16" fill="#BAE6FD"/>
    <circle cx="330" cy="190" r="18" fill="#FFFFFF"/>
  </g>
</svg>
