<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="mpStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- 底板容器 -->
  <rect width="512" height="512" rx="115" fill="url(#bg2)"/>

  <!-- MP 连续几何线条 (Mind-Wave + Post-Loop) -->
  <g filter="url(#glow2)">
    <!-- M 结构 (双拱起伏) -->
    <path d="M 125 350 L 125 220 C 125 165 170 165 190 215 C 210 165 255 165 255 220 L 255 350" 
          stroke="url(#mpStroke)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- P 结构 (右侧闭环) -->
    <path d="M 255 210 C 255 145 385 145 385 225 C 385 295 255 295 255 295" 
          stroke="#38BDF8" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- 核心信标节点 -->
    <circle cx="320" cy="220" r="20" fill="#FFFFFF"/>
  </g>
</svg>
