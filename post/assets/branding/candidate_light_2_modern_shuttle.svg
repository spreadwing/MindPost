<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 淡蓝渐变底板 (冰蓝海风渐变) -->
    <linearGradient id="bgLightBlue2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80C7FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- 柔和悬浮光晕 -->
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0369A1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 桌面图标圆角底板 (Squircle) -->
  <rect width="512" height="512" rx="115" fill="url(#bgLightBlue2)"/>

  <!-- 现代宽展超音速纯白飞翼 -->
  <g filter="url(#shadow2)">
    <!-- 底部三角机腹 (淡青冰蓝 #BAE6FD) -->
    <polygon points="395,115 220,315 200,345" fill="#BAE6FD"/>

    <!-- 左侧展开机翼 (极浅纯净白 #F1F8FE) -->
    <polygon points="395,115 110,245 250,275" fill="#F1F8FE"/>

    <!-- 右侧迎风主翼 (100% 极纯雪白 #FFFFFF) -->
    <polygon points="395,115 250,275 245,395" fill="#FFFFFF"/>

    <!-- 中央锋利折骨高光线 -->
    <line x1="395" y1="115" x2="250" y2="275" stroke="#E0F2FE" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
