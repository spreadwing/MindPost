<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 柔和立体悬浮投影 -->
    <filter id="shadowSolid" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1E429F" flood-opacity="0.22"/>
    </filter>

    <!-- 主翼自投影 -->
    <filter id="wingShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="8" stdDeviation="10" flood-color="#1E3A8A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 桌面图标圆角底板 (纯色淡蓝，无渐变 #4DA3FF) -->
  <rect width="512" height="512" rx="115" fill="#4DA3FF"/>

  <!-- 纯白双层悬浮折纸飞机 -->
  <g filter="url(#shadowSolid)">
    <!-- 下层机身折叠面 (淡冰蓝 #BFDBFE) -->
    <polygon points="380,130 220,330 180,310" fill="#BFDBFE"/>
    
    <!-- 左翼底层 (纯净雪白 #F0F6FF) -->
    <polygon points="380,130 135,285 240,290" fill="#F0F6FF"/>

    <!-- 右主翼 (悬浮于上层，100% 极纯雪白 #FFFFFF + 细腻微投影) -->
    <polygon points="380,130 240,290 280,380" fill="#FFFFFF" filter="url(#wingShadow)"/>
  </g>
</svg>
