<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadowSolid2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
    <filter id="wingShadow2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="8" stdDeviation="10" flood-color="#0369A1" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 纯色淡蓝 B：冰青浅蓝 #38BDF8 -->
  <rect width="512" height="512" rx="115" fill="#38BDF8"/>

  <g filter="url(#shadowSolid2)">
    <polygon points="380,130 220,330 180,310" fill="#BAE6FD"/>
    <polygon points="380,130 135,285 240,290" fill="#F0F9FF"/>
    <polygon points="380,130 240,290 280,380" fill="#FFFFFF" filter="url(#wingShadow2)"/>
  </g>
</svg>
